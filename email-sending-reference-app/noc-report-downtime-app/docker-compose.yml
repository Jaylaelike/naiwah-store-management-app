services:
  app:
    container_name: noc-report-downtime-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3002:3002"
    environment:
      # Use a separate directory for the database to ensure persistence
      - DATABASE_URL=file:/app/db/prod.db
      - NODE_ENV=production
      - PORT=3002
      # Pass necessary env vars
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST="true"
      - NEXT_PUBLIC_BASE_PATH=/noc-report
      - NEXTAUTH_URL=http://localhost:3002/noc-report/api/auth
      - AUTH_URL=http://localhost:3002/api/auth
    env_file:
      - .env
    volumes:
      - db_data:/app/db
    # Run migrations/push schema before starting the server
    # Running as root to avoid volume permission issues with SQLite
    user: root
    command: sh -c "npx prisma db push --accept-data-loss && npm start"

volumes:
  db_data:
